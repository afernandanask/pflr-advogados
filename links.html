body.lk{display:flow-root}
body.lk{background:var(--g850);color:var(--white);min-height:100svh;overflow-x:hidden}
.lk-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--g850)}
.lk-bg video,.lk-bg img{width:100%;height:100%;object-fit:cover;display:block}
.lk-bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(6,15,12,.55) 0%,rgba(6,15,12,.12) 24%,rgba(6,15,12,.72) 46%,rgba(6,15,12,.96) 70%,var(--g850) 100%)}
.lk-main{position:relative;z-index:1;min-height:100svh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.lk-logo{width:92px;height:auto;color:var(--white)}
.lk-body{margin-top:auto;padding-top:48px}
.lk-eye{display:flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--g200);margin:0 0 18px}
.lk-eye::before{content:"";width:5px;height:5px;background:var(--g400);flex:none}
.lk h1{font-size:clamp(40px,13vw,58px);line-height:1.04;color:var(--white);margin:0 0 32px}
.lk h1 .nb{white-space:nowrap}
.lk-links{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.lk-links .btn{width:100%;height:58px;justify-content:space-between;padding:0 6px 0 20px;font-size:15px}
.lk-links .btn .sq{width:46px;height:46px}
.lk-links .btn .lbl{display:flex;align-items:center;gap:12px}
.lk-links .btn-p{background:var(--g200);color:var(--g800)}
.lk-links .btn-p .sq{background:var(--g700);color:var(--g200)}
.lk-links .btn-p:hover{background:var(--white)}
.lk-links .btn-g{background:rgba(247,248,247,.06);color:var(--white);box-shadow:inset 0 0 0 1px rgba(247,248,247,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lk-links .btn-g .sq{background:rgba(247,248,247,.1);color:var(--g200)}
.lk-links .btn-g:hover{background:rgba(247,248,247,.12);box-shadow:inset 0 0 0 1px rgba(247,248,247,.45)}
.lk-foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--line-d);display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--g400)}
.lk-foot a{color:var(--g200);text-decoration:none}
.lk-foot a:hover{color:var(--white)}
.lk-main>*:not(.lk-bg){position:relative;z-index:1}
@media (min-width:768px){
  .lk-main{max-width:460px;min-height:calc(100svh - 64px);margin:32px auto;padding:36px 32px 28px;
    border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(247,248,247,.12),0 30px 80px rgba(0,0,0,.45)}
  .lk-bg{position:absolute}
  .lk-logo{width:100px}
}
@media (prefers-reduced-motion:reduce){.lk-bg video{display:none}}
</style>
